name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff, incl. bandit security rules)
        run: ruff check hivewatch tests
      - name: Tests
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t hivewatch:ci .
      - name: Smoke test (demo mode)
        run: |
          docker run -d --name hw -p 8000:8000 -e HW_MODE=demo -e HW_DEMO_BACKFILL=5 hivewatch:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/healthz && break; sleep 1; done
          curl -sf localhost:8000/api/stats | python -c "import sys,json; d=json.load(sys.stdin); assert d['kpis']['events']>0; print('events:', d['kpis']['events'])"
