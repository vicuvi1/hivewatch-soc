# Live honeypot deployment.  Usage:  cp .env.example .env && docker compose up -d
services:
  hivewatch:
    build: .
    container_name: hivewatch
    restart: unless-stopped
    env_file: .env
    environment:
      HW_DASH_HOST: 0.0.0.0
    ports:
      # Dashboard: localhost only -> reach it with  ssh -L 8000:localhost:8000 you@vps
      - "127.0.0.1:8000:8000"
      # Honeypot sensors exposed to the internet on their real well-known ports
      - "22:2222"     # SSH   (move your real sshd to another port first!)
      - "23:2323"     # Telnet
      - "80:8080"     # HTTP
      - "3389:3389"
      - "5900:5900"
      - "3306:3306"
      - "6379:6379"
      - "9200:9200"
    volumes:
      - hivewatch-data:/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 200

volumes:
  hivewatch-data:
